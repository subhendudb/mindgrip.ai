[project]
name = "lerobot_robot_so101_mujoco"
version = "0.1.0"
description = "LeRobot plugin: SO-101 MuJoCo simulated follower"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "lerobot",
  "mujoco>=3.1.0,<3.4.0",
]

[project.optional-dependencies]
# pynput is pulled by keyboard teleop / recording UX; keep optional here.
viewer = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_so101_mujoco"]

[tool.hatch.build.targets.wheel.force-include]
"lerobot_robot_so101_mujoco/assets" = "lerobot_robot_so101_mujoco/assets"
